name: Job Radar

on:
  schedule:
    # Every 15 minutes. GitHub Actions cron is best-effort and may delay
    # under heavy load, but typically lands within a couple minutes.
    - cron: "*/15 * * * *"
  workflow_dispatch:  # Lets you trigger a run manually from the Actions tab

permissions:
  contents: write  # Needed so the workflow can commit the updated seen_jobs.json

concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run job radar
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
        run: python main.py

      - name: Commit updated seen-jobs cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/seen_jobs.json)" ]]; then
            git add data/seen_jobs.json
            git commit -m "chore: update seen jobs cache [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
