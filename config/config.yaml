# What you're looking for. Edit this to taste.

search:
  # Keywords that must appear in the job title (case-insensitive).
  # A job matches if ANY of these phrases is in the title.
  title_keywords:
    - "paid search"
    - "paid media"
    - "performance marketing"
    - "digital marketing manager"
    - "growth marketing"
    - "marketing manager"
    - "senior manager"
    - "search marketing"
    - "sem"

  # Optional: if non-empty, the title must ALSO contain at least one of these.
  # Useful for narrowing seniority. Leave empty to skip.
  seniority_keywords:
    - "senior"
    - "sr."
    - "manager"
    - "lead"
    - "principal"
    - "staff"

  # Locations to search. JobSpy uses these as query parameters on LinkedIn/Indeed.
  locations:
    - "Austin, TX"
    - "Remote"

  # Hard location filter applied to ALL sources (including ATS career pages).
  # A job's location field must contain at least one of these substrings
  # (case-insensitive) or the job is dropped. Leave empty to skip the filter.
  # "remote" also matches phrases like "Remote - US", "Fully remote", etc.
  allowed_locations:
    - "austin"
    - "remote"
    - "tx"     # catches "Austin, TX" variants and stray "TX - Remote" listings

  # How far back to look on first run. After that, dedupe takes over.
  hours_old: 24

  # Hard exclusions. If any of these appear in the title, skip the job.
  title_blocklist:
    - "intern"
    - "internship"
    - "entry level"
    - "junior"
    - "associate"
    - "coordinator"
    - "assistant"

# LinkedIn + Indeed scraping via JobSpy
jobspy:
  enabled: true
  sites: ["linkedin", "indeed"]
  results_wanted: 50  # per site, per location

# Direct company career page polling. Add companies you actually care about.
# Each entry needs the ATS platform and the company's board slug.
#
# How to find the slug:
#   Greenhouse: boards.greenhouse.io/<slug>           e.g. boards.greenhouse.io/stripe -> "stripe"
#   Lever:      jobs.lever.co/<slug>                  e.g. jobs.lever.co/netflix       -> "netflix"
#   Ashby:      jobs.ashbyhq.com/<slug>               e.g. jobs.ashbyhq.com/notion     -> "notion"
#
# If a slug doesn't work, the scraper logs an error and skips it without
# breaking the run. Test new additions by checking that the public URL loads
# in a browser first.
companies:
